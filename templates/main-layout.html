<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block "page_title" %} Page Title {% endblock %}</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 3rem 1rem;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background-color: #f4f1ea;
        color: #23211d;
      }

      header.main-nav {
        max-width: 40rem;
        margin: 0 auto 1.5rem;
      }

      header.main-nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: 1.5rem;
      }

      header.main-nav a {
        text-decoration: none;
        color: #6b665c;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 0.8rem;
      }

      header.main-nav a:hover {
        color: #2f6f4f;
      }

      main {
        max-width: 40rem;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: 1.75rem;
      }

      p.intro {
        color: #6b665c;
        margin-bottom: 2rem;
      }

      h2 {
        font-size: 1.05rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #6b665c;
        margin: 2rem 0 1rem;
      }

      p.eyebrow {
        margin: 0 0 0.35rem;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #2f6f4f;
      }

      ul.features {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1rem;
      }

      ul.features li {
        padding-left: 1rem;
        border-left: 3px solid #ded8ca;
        color: #4a463f;
        line-height: 1.55;
      }

      ul.features code {
        background-color: #f4f1ea;
        padding: 0.1rem 0.3rem;
        border-radius: 3px;
        font-size: 0.85em;
      }

      a.cta {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.75rem 1.25rem;
        background-color: #2f6f4f;
        color: #ffffff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
      }

      a.cta:hover {
        background-color: #245740;
      }

      ul.months {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
        gap: 0.75rem;
      }

      ul.months a {
        display: block;
        padding: 0.75rem 1rem;
        border: 1px solid #ded8ca;
        border-radius: 6px;
        text-decoration: none;
        color: #23211d;
        font-weight: 600;
      }

      ul.months a:hover {
        background-color: #2f6f4f;
        border-color: #2f6f4f;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    {% include "main-nav.html" %}

    {% block "page_content" %}No Page Content Available{% endblock %}
  </body>
</html>
